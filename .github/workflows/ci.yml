name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m pytest test/ -q --tb=short

      - name: Syntax check
        run: |
          python3 -m py_compile src/domainradar/*.py

  test-shell:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          bash -n install/domainradar.sh
          bash -n install/domainradar-inner.sh
          bash -n harness/run.sh
          bash -n harness/installer-mock.sh

      - name: shellcheck
        uses: ludeeus/action-shellcheck@v2
        with:
          severity: warning
          files: install/*.sh harness/*.sh

      - name: Installer mock test
        run: bash harness/installer-mock.sh

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check bundle size
        working-directory: web
        run: |
          SIZE=$(du -sb dist/assets/*.js 2>/dev/null | awk '{print $1}' | head -1)
          echo "Bundle size: $SIZE bytes"
          # Warnung ab 500 KB, Fehler ab 1 MB
          if [ "${SIZE:-0}" -gt 1048576 ]; then
            echo "::error::Bundle zu groß ($SIZE bytes > 1 MB)"
            exit 1
          elif [ "${SIZE:-0}" -gt 524288 ]; then
            echo "::warning::Bundle größer als 500 KB ($SIZE bytes)"
          fi
